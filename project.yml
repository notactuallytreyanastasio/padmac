name: RemoteMac
options:
  bundleIdPrefix: com.bgrayson.remotemac
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: NY422J2AAW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RemoteMacHost:
    type: application
    platform: macOS
    sources: [Host, Shared]
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Remote Mac Host
        LSUIElement: true
        NSLocalNetworkUsageDescription: Lets your iPad find and connect to this Mac.
        NSBonjourServices: [_remotemac._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgrayson.remotemac.host
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: Apple Development
    scheme:
      testTargets: [RemoteMacTests]
  RemoteMac:
    type: application
    platform: iOS
    sources: [Client, Shared]
    info:
      path: Client/Info.plist
      properties:
        CFBundleDisplayName: Remote Mac
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Finds Macs running Remote Mac Host on your network.
        NSBonjourServices: [_remotemac._tcp]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgrayson.remotemac.ipad
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [RemoteMacClientTests, RemoteMacUITests]
  probe:
    scheme: {}
    type: tool
    platform: macOS
    sources: [Probe, Shared, Host/DockSwipe.swift, Client/KeyRemapper.swift]
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  # Wire format, framing over real TLS, the codec pipeline, input logic, key
  # map against the real US layout, and the host server in dry-run mode.
  RemoteMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Mac
      - Shared
      - path: Host
        excludes: [HostApp.swift, Info.plist]
      - Client/KeyMap.swift
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
  # Pure iPad-side logic: zoom geometry.
  RemoteMacClientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Client, Client/Viewport.swift, Client/SwipeTracker.swift, Client/PointerAcceleration.swift, Client/AudioPlayer.swift, Client/KeyRemapper.swift, Client/RateMeter.swift, Shared/Wire.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  # The real app, real gestures, against a dry-run host (see scripts/test.sh).
  RemoteMacUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI, Shared/Wire.swift]
    dependencies:
      - target: RemoteMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RemoteMac
